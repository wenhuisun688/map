<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e0e12">
  <meta name="description" content="VALORANT 点位手册，查找穿墙、烟位和道具点位。">
  <title>VALORANT · 点位手册</title>
  <link rel="icon" href="assets/favicon.jpg">
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/viewer.css"><link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/point-colors.css"><link rel="stylesheet" href="css/agent-polish.css"><link rel="stylesheet" href="css/portraits.css"><link rel="stylesheet" href="css/glass.css"><link rel="stylesheet" href="css/spray-menu.css"><link rel="preload" as="image" href="assets/sprays/wingman-motion.webp" media="(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)"><link rel="preload" as="image" href="assets/sprays/bunny-motion.webp" media="(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)"><link rel="preload" as="image" href="assets/sprays/omen-motion.webp" media="(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)"><link rel="preload" as="image" href="assets/sprays/bruno-motion.webp" media="(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)"><link rel="preload" as="image" href="assets/sprays/hehe-motion.webp" media="(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)"><link rel="preload" as="image" href="assets/sprays/pengu-motion.webp" media="(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)"><link rel="preload" as="image" href="assets/sprays/tactibear-motion.webp" media="(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)"></head>
<body class="public-site">
  <main id="home" class="home-page spray-home"><header class="home-header">
      <img src="assets/valorant-logo.webp" alt="VALORANT" class="home-logo">
      <div class="home-actions">
        <button id="favorites-open" class="home-btn home-btn-save" aria-label="我的收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          我的收藏
        </button>
      </div>
    </header><section class="spray-hub" aria-labelledby="hub-title"><h1 id="hub-title">点位手册</h1><div class="spray-grid"><button id="enter-map" class="agent-card menu-spray wingman-card" disabled><img class="spray-art" src="assets/sprays/wingman.webp" data-still="assets/sprays/wingman.webp" data-motion="assets/sprays/wingman-motion.webp" data-strip="assets/sprays/wingman-strip.webp" data-delays='[170,160,170,170,160,170]' alt="皮蛋摇摆喷漆" draggable="false" width="512" height="512"><span class="agent-card-bottom"><span><strong>穿墙点位</strong></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button><button id="enter-utility" class="agent-card menu-spray bunny-card"><img class="spray-art" src="assets/sprays/bunny.webp" data-still="assets/sprays/bunny.webp" data-motion="assets/sprays/bunny-motion.webp" data-strip="assets/sprays/bunny-strip.webp" data-delays='[170,160,170,170,160,170,170,160]' alt="跳跳兔喷漆" draggable="false" width="512" height="512"><span class="agent-card-bottom"><span><strong>道具点位</strong></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button><button  class="agent-card menu-spray omen-card" data-upcoming="烟位点位"><img class="spray-art" src="assets/sprays/omen.webp" data-still="assets/sprays/omen.webp" data-motion="assets/sprays/omen-motion.webp" data-strip="assets/sprays/omen-strip.webp" data-delays='[210,210,210,200,210,210,210,210,210,200]' alt="幽影猫猫舞喷漆" draggable="false" width="512" height="512"><span class="agent-card-bottom"><span><strong>烟位点位</strong><span class="agent-skills">待开放</span></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button><button class="agent-card menu-spray bruno-card" data-upcoming="皮肤专题"><img class="spray-art" src="assets/sprays/bruno.webp" data-still="assets/sprays/bruno.webp" data-motion="assets/sprays/bruno-motion.webp" data-strip="assets/sprays/bruno-strip.webp" data-delays='[170,160,170,170,160,170]' alt="" draggable="false" width="512" height="512"><span class="agent-card-bottom"><span><strong>皮肤专题</strong><span class="agent-skills">待开放</span></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button><button class="agent-card menu-spray hehe-card" data-upcoming="版本最新改动"><img class="spray-art" src="assets/sprays/hehe.webp" data-still="assets/sprays/hehe.webp" data-motion="assets/sprays/hehe-motion.webp" data-strip="assets/sprays/hehe-strip.webp" data-delays='[170,160,170,170]' alt="" draggable="false" width="512" height="512"><span class="agent-card-bottom"><span><strong>版本最新改动</strong><span class="agent-skills">待开放</span></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button><button class="agent-card menu-spray pengu-card" data-upcoming="地图报点"><img class="spray-art" src="assets/sprays/pengu.webp" data-still="assets/sprays/pengu.webp" data-motion="assets/sprays/pengu-motion.webp" data-strip="assets/sprays/pengu-strip.webp" data-delays='[140,140,140,140]' alt="" draggable="false" width="512" height="512"><span class="agent-card-bottom"><span><strong>地图报点</strong><span class="agent-skills">待开放</span></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button><button class="agent-card menu-spray tactibear-card" data-upcoming="准星"><img class="spray-art" src="assets/sprays/tactibear.webp" data-still="assets/sprays/tactibear.webp" data-motion="assets/sprays/tactibear-motion.webp" data-strip="assets/sprays/tactibear-strip.webp" data-delays='[170,160,170,170]' alt="" draggable="false" width="512" height="512"><span class="agent-card-bottom"><span><strong>准星</strong><span class="agent-skills">待开放</span></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button></div></section><div class="home-errors"><p id="load-error" class="error" role="alert" hidden></p><button id="reload-data" class="quiet" hidden>重新加载</button></div></main>
  <main id="agents" class="home" hidden><div class="ambient-lights" aria-hidden="true"><i class="glow-red"></i><i class="glow-white"></i></div><div class="home-container"><header class="home-header"><a class="agent-back" href="#" aria-label="返回首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg><span>首页</span></a><img class="agent-brand" src="assets/valorant-logo.webp" alt="VALORANT"></header><section class="agent-hub"><div class="agent-heading"><h1>道具点位</h1><p>选择你的英雄</p></div><div class="agent-grid"><button class="agent-card sova-card" data-agent="sova"><span class="agent-word" aria-hidden="true">SOVA</span><img src="assets/agents/sova.webp" alt="猎枭角色立绘" draggable="false"><span class="agent-card-bottom"><span><strong>猎枭</strong><span class="agent-skills">探测箭 &middot; 震击箭</span></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button><button class="agent-card fade-card" data-agent="fade"><span class="agent-word" aria-hidden="true">FADE</span><img src="assets/agents/fade.webp" alt="黑梦角色立绘" draggable="false"><span class="agent-card-bottom"><span><strong>黑梦</strong><span class="agent-skills">鬼眼</span></span><span class="agent-enter" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></span></button></div></section></div></main>
  <main id="map-page" hidden>
    <nav class="viewer-nav"><a href="#" class="back-link" aria-label="返回首页"><span aria-hidden="true">&lsaquo;</span><img src="assets/valorant-logo.webp" alt="VALORANT"></a><span class="nav-divider"></span><h1>穿墙点位</h1><button id="list-toggle" class="nav-list-button">点位列表 <span aria-hidden="true">☷</span></button></nav>
    <div class="tabs-wrap"><div id="map-tabs" class="map-tabs" aria-label="切换地图"><span id="tab-indicator" class="tab-indicator" aria-hidden="true"></span></div></div>
    <div class="viewer-workspace">
      <section class="viewer-map-column">
        <div class="map-stage-heading"><div><span id="map-en" class="eyebrow">HAVEN</span><h2 id="map-name">隐世修所</h2></div><div class="map-stage-actions"><div id="side-switch" class="side-switch" data-side="attack" role="group" aria-label="筛选阵营"><span class="side-slider" aria-hidden="true"></span><button data-side="attack" aria-pressed="true">进攻方</button><button data-side="defense" aria-pressed="false">防守方</button></div><span id="map-count" class="map-count-pill"></span></div></div>
        <div id="viewer-map" class="map-surface"><div class="map-corner top-left" aria-hidden="true"></div><div class="map-corner bottom-right" aria-hidden="true"></div></div>
        <div class="viewer-bottom"><div class="legend"><span><i></i>进攻</span><span class="defense"><i></i>防守</span><span class="combined"><i></i>多个点位</span></div><span class="gesture-hint">拖动查看 &middot; 滚轮缩放</span></div>
      </section>
      <aside id="guide-panel" class="guide-panel" aria-label="点位指南">
        <section id="overview" class="overview"><div class="panel-heading"><h2>点位列表</h2></div><div id="overview-list" class="overview-list"></div></section>
        <section id="detail" hidden aria-label="点位详情"><div class="detail-head"><div><span class="eyebrow">POINT GUIDE</span><h2 id="detail-title"></h2><div id="detail-badges" class="row"></div></div><button id="detail-close" class="icon-close" aria-label="关闭详情">&times;</button></div><div class="detail-body"><div class="instruction-heading"><span class="step-number">01</span><h3>操作说明</h3></div><p id="detail-description"></p><div class="instruction-heading"><span class="step-number">02</span><h3>站位与瞄点</h3><span class="image-hint">点击图片放大</span></div><div id="detail-images"></div></div></section>
      </aside>
    </div>
  </main>
  <button id="detail-backdrop" class="detail-backdrop" aria-label="关闭点位详情" hidden></button>
  <dialog id="point-picker"><div class="dialog-head"><div><span class="eyebrow">POINT COLLECTION</span><h2>选择点位</h2></div><button id="picker-close" class="icon-close" aria-label="关闭点位列表">&times;</button></div><div id="picker-list" class="dialog-body"></div></dialog>
  <dialog id="upcoming-dialog"><div class="dialog-head"><h2 id="upcoming-title"></h2><button id="upcoming-close" class="icon-close" aria-label="关闭">&times;</button></div><div class="dialog-body"><p id="upcoming-description">这个功能还未开放。</p></div></dialog>
<dialog id="favorites-dialog"><div class="dialog-head"><h2>我的收藏</h2><button id="favorites-close" class="icon-close" aria-label="关闭收藏">&times;</button></div><div id="favorites-list" class="dialog-body"></div></dialog>
  <script type="module" src="js/viewer.js"></script><script type="module" src="js/menu-motion.js"></script>
</body>
</html>
